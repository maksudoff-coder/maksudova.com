<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#05060a;overflow:hidden}</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
}}
</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const params = new URLSearchParams(location.search);
const CLIP = params.get("clip") || "hero";
const W = +(params.get("w") || 1600), H = +(params.get("h") || 900);

// ---------- deterministic RNG ----------
let seed = 1337;
const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color("#05060a");
scene.background = BG;
scene.fog = new THREE.FogExp2(BG, 0.035);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 200);

// ---------- lights ----------
const key = new THREE.DirectionalLight("#ffe7c2", 2.4); key.position.set(5, 8, 6); scene.add(key);
const rim = new THREE.DirectionalLight("#5fd4e6", 2.0); rim.position.set(-8, 2, -6); scene.add(rim);
const fill = new THREE.PointLight("#17a2b8", 30, 30); fill.position.set(-3, -2, 4); scene.add(fill);
scene.add(new THREE.AmbientLight("#1a1d2a", 0.6));

// ---------- materials ----------
const GOLD = new THREE.MeshPhysicalMaterial({ color: "#e8c27a", metalness: 1, roughness: 0.18, clearcoat: 0.6, clearcoatRoughness: 0.15 });
const GOLD_SOFT = new THREE.MeshPhysicalMaterial({ color: "#c99a4b", metalness: 1, roughness: 0.32 });
const OBSIDIAN = new THREE.MeshPhysicalMaterial({ color: "#11141d", metalness: 0.4, roughness: 0.28, clearcoat: 0.6, clearcoatRoughness: 0.25, envMapIntensity: 0.45 });
const TEAL_GLOW = new THREE.MeshStandardMaterial({ color: "#0b3d46", emissive: "#2cc7dd", emissiveIntensity: 2.2, roughness: 0.3 });
const CRYSTAL = new THREE.MeshPhysicalMaterial({
  color: "#dff6ff", metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.9, ior: 1.5,
  iridescence: 0.6, iridescenceIOR: 1.3, clearcoat: 1, attenuationColor: new THREE.Color("#eef9ff"), attenuationDistance: 8,
  specularIntensity: 1, envMapIntensity: 1.4, flatShading: true,
});

// ---------- dust particles (shared) ----------
function makeDust(n, spread) {
  const g = new THREE.BufferGeometry(); const p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p[i*3] = (rnd()-.5)*spread; p[i*3+1] = (rnd()-.5)*spread*.6; p[i*3+2] = (rnd()-.5)*spread; }
  g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  const m = new THREE.PointsMaterial({ color: "#f3d9a4", size: 0.035, transparent: true, opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending });
  return new THREE.Points(g, m);
}

// ---------- glyph sprites ----------
function glyph(txt, color) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const x = c.getContext("2d");
  x.font = "italic 300 170px 'DejaVu Serif', Georgia, serif";
  x.textAlign = "center"; x.textBaseline = "middle";
  x.shadowColor = color; x.shadowBlur = 24; x.fillStyle = color;
  x.fillText(txt, 128, 136);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, opacity: 0.85 }));
  return s;
}

const ease = (t) => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;

let update;

if (CLIP === "hero") {
  // Crystal core + golden armillary rings + floating math glyphs
  const core = new THREE.Group(); scene.add(core);
  const crystal = new THREE.Mesh(new THREE.IcosahedronGeometry(1.55, 0), CRYSTAL); core.add(crystal);
  const inner = new THREE.Mesh(new THREE.DodecahedronGeometry(0.62, 0), GOLD); core.add(inner);
  const innerWire = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.56, 0)),
    new THREE.LineBasicMaterial({ color: "#f5d9a0", transparent: true, opacity: 0.55 }));
  core.add(innerWire);

  const rings = [];
  const ringDefs = [ [2.5, 0.018, [Math.PI/2.4, 0, 0.2]], [3.05, 0.012, [0.3, 0.9, 0]], [3.6, 0.022, [1.2, -0.4, 0.6]] ];
  ringDefs.forEach(([r, tube, rot], i) => {
    const grp = new THREE.Group(); grp.rotation.set(...rot);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 16, 220), i === 1 ? GOLD_SOFT : GOLD); grp.add(ring);
    const beads = [];
    for (let k = 0; k < 3 + i; k++) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.06 + 0.03 * (k % 2), 24, 16), k === 0 ? TEAL_GLOW : GOLD);
      grp.add(b); beads.push({ m: b, r, off: k / (3 + i) * Math.PI * 2 });
    }
    scene.add(grp); rings.push({ grp, beads, speed: (i % 2 ? -1 : 1) * (0.6 + i * 0.25), r });
  });

  const glyphs = [];
  const chars = ["π","∑","√","∞","Δ","x²","÷","+","=","θ","φ","%","∫","7","3","½"];
  for (let i = 0; i < 34; i++) {
    const s = glyph(chars[i % chars.length], i % 5 === 0 ? "#7fe3f2" : "#f1d29a");
    const r = 4.2 + rnd() * 7, a = rnd() * Math.PI * 2, y = (rnd() - .5) * 6;
    const sc = 0.35 + rnd() * 0.55; s.scale.set(sc, sc, 1);
    scene.add(s); glyphs.push({ s, r, a, y, sp: 0.15 + rnd() * 0.35 });
  }
  const dust = makeDust(1400, 34); scene.add(dust);

  // pedestal glow disc
  const halo = new THREE.Mesh(new THREE.RingGeometry(1.9, 6, 128), new THREE.MeshBasicMaterial({ color: "#17a2b8", transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.rotation.x = -Math.PI / 2; halo.position.y = -2.6; // (disabled: read as a dark planet)

  update = (t) => {
    const e = ease(t);
    // camera: wide dramatic push-in + 210° orbit, rising
    const ang = lerp(-0.35, 3.3, e);
    const dist = lerp(15.5, 7.6, ease(seg(t, 0, 0.75))) + Math.sin(t * Math.PI) * 0.6;
    const hgt = lerp(-1.2, 2.4, e);
    camera.position.set(Math.sin(ang) * dist, hgt, Math.cos(ang) * dist);
    camera.lookAt(0, lerp(-0.2, 0.15, e), 0);
    camera.fov = lerp(30, 36, e); camera.updateProjectionMatrix();

    core.rotation.set(t * 1.1, t * 2.6, t * 0.4);
    inner.rotation.set(-t * 3.0, -t * 2.2, 0);
    const open = ease(seg(t, 0.15, 0.8));
    rings.forEach((R, i) => {
      R.grp.rotation.z = ringDefs[i][2][2] + t * R.speed * 2.2;
      R.grp.rotation.y = ringDefs[i][2][1] + t * R.speed;
      R.grp.scale.setScalar(lerp(0.82, 1.08, open));
      R.beads.forEach((B) => { const a = B.off + t * R.speed * 6; B.m.position.set(Math.cos(a) * B.r, Math.sin(a) * B.r, 0); });
    });
    glyphs.forEach((G) => {
      const a = G.a + t * G.sp * 3;
      G.s.position.set(Math.cos(a) * G.r, G.y + Math.sin(t * 6 + G.a) * 0.25, Math.sin(a) * G.r);
      G.s.material.opacity = 0.25 + 0.6 * open;
    });
    dust.rotation.y = t * 0.6;
    TEAL_GLOW.emissiveIntensity = 1.6 + Math.sin(t * 20) * 0.6;
  };
}

if (CLIP === "method") {
  fill.intensity = 6; key.intensity = 2.2; rim.intensity = 0.35; scene.environmentIntensity = 0.75;
  // frame the subject on the right ~63% so copy can live on the left (focusX in the site config)
  camera.setViewOffset(W, H, -Math.round(W * 0.13), 0, W, H);
  // 5x5x5 cube → explodes → reassembles into a golden-angle (Fibonacci) spiral
  const N = 125, cubes = [];
  const geo = new THREE.BoxGeometry(0.42, 0.42, 0.42);
  const mats = [OBSIDIAN, GOLD, OBSIDIAN, GOLD_SOFT, OBSIDIAN];
  const GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const gx = i % 5, gy = Math.floor(i / 5) % 5, gz = Math.floor(i / 25);
    const A = new THREE.Vector3((gx - 2) * 0.46, (gy - 2) * 0.46, (gz - 2) * 0.46);
    const dir = new THREE.Vector3(rnd() - .5, rnd() - .5, rnd() - .5).normalize();
    const B = dir.multiplyScalar(3.5 + rnd() * 4.5);
    const r = 0.36 * Math.sqrt(i + 1), th = i * GA;
    const C = new THREE.Vector3(Math.cos(th) * r, Math.sin(th) * r, Math.sin(r * 1.4) * 0.35 - r * 0.12);
    const isTeal = i % 11 === 0 && (gx === 0 || gx === 4 || gy === 0 || gy === 4 || gz === 0 || gz === 4);
    const m = new THREE.Mesh(geo, isTeal ? TEAL_GLOW : mats[(gx + gy + gz) % mats.length]);
    const spin = new THREE.Euler(rnd() * 6, rnd() * 6, rnd() * 6);
    const scaleC = lerp(0.55, 1.15, i / N);
    scene.add(m); cubes.push({ m, A, B, C, spin, scaleC, th, delay: rnd() * 0.08 });
  }
  const dust = makeDust(1600, 36); scene.add(dust);
  const spiralGroup = new THREE.Group(); scene.add(spiralGroup);
  // thin golden spiral line that draws in at the end
  const pts = []; for (let k = 0; k < 400; k++) { const a = k * 0.045; const r = 0.08 * Math.exp(0.1759 * a); pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0.05)); }
  const spiralGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const spiral = new THREE.Line(spiralGeo, new THREE.LineBasicMaterial({ color: "#f5d9a0", transparent: true, opacity: 0.9 }));
  spiralGroup.add(spiral);

  const tmp = new THREE.Vector3();
  update = (t) => {
    // camera: slow arc, pulls back during explosion, settles frontal-ish
    const ang = lerp(0.9, -0.35, ease(t));
    const dist = 10.5 + Math.sin(seg(t, 0.1, 0.7) * Math.PI) * 5 + ease(seg(t, 0.6, 1)) * 4.5;
    const hgt = lerp(3.2, 0.6, ease(t));
    camera.position.set(Math.sin(ang) * dist, hgt, Math.cos(ang) * dist);
    camera.lookAt(0, 0, 0);
    camera.fov = 34; camera.updateProjectionMatrix();

    const explode = ease(seg(t, 0.08, 0.42));
    cubes.forEach((c, i) => {
      const assemble = ease(seg(t, 0.46 + c.delay, 0.86 + c.delay * 0.5));
      if (assemble <= 0) tmp.copy(c.A).lerp(c.B, explode);
      else tmp.copy(c.B).lerp(c.C, assemble);
      // gentle float
      tmp.y += Math.sin(t * 9 + i) * 0.05 * (explode - assemble * 0.9);
      c.m.position.copy(tmp);
      const s = explode < 1 || assemble <= 0 ? lerp(1, 0.85, explode) : lerp(0.85, c.scaleC * 0.75, assemble);
      c.m.scale.setScalar(s);
      const spinAmt = explode * (1 - assemble);
      c.m.rotation.set(c.spin.x * spinAmt + t * 0.6, c.spin.y * spinAmt + t * 0.4, c.spin.z * spinAmt + (assemble * c.th));
    });
    const sp = ease(seg(t, 0.78, 1));
    spiralGeo.setDrawRange(0, Math.floor(400 * sp));
    spiralGroup.rotation.z = t * 0.2;
    scene.children.forEach(() => {});
    dust.rotation.y = -t * 0.5;
    TEAL_GLOW.emissiveIntensity = 0.12 + explode * 1.6 - ease(seg(t, 0.5, 0.9)) * 0.8;
  };
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), CLIP === "method" ? 0.38 : 0.5, 0.55, 0.88));
composer.addPass(new OutputPass());

window.renderAt = (t) => { update(t); composer.render(); return renderer.domElement.toDataURL("image/jpeg", 0.9); };
window.ready = true;
</script>
</body></html>
